backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "content"
        label: "All Content"
        file: "content.json"
        format: json
        fields:

          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "First Name", name: "name", widget: "string" }
              - { label: "Last Name (italic)", name: "name_italic", widget: "string" }
              - { label: "Role Tagline", name: "role", widget: "string" }
              - { label: "Mission Paragraph", name: "mission", widget: "text" }

          - label: "Work"
            name: "work"
            widget: "list"
            fields:
              - { label: "Number", name: "num", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "sub", widget: "string" }
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Year", name: "year", widget: "string" }
              - label: "Body Paragraphs"
                name: "body"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }

          - label: "Writing"
            name: "writing"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - { label: "Date", name: "date", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - label: "Body Paragraphs"
                name: "body"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }

          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - label: "Bio Paragraphs"
                name: "bio"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }
              - { label: "Based In", name: "based_in", widget: "string" }
              - label: "Specialisms"
                name: "specialisms"
                widget: "list"
                field: { label: "Specialism", name: "specialism", widget: "string" }
              - label: "Links"
                name: "links"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "CV URL", name: "cv_url", widget: "string" }

          - label: "Garage"
            name: "garage"
            widget: "object"
            fields:
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - label: "Listings"
                name: "listings"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Price", name: "price", widget: "string" }
                  - { label: "Year", name: "year", widget: "string" }
                  - { label: "Mileage", name: "mileage", widget: "string" }
                  - { label: "Condition", name: "condition", widget: "string" }
                  - { label: "Contact URL", name: "contact_url", widget: "string" }
                  - label: "Body Paragraphs"
                    name: "body"
                    widget: "list"
                    field: { label: "Paragraph", name: "paragraph", widget: "text" }

          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Body Text", name: "body", widget: "text" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Location Note", name: "location_note", widget: "string" }
              - label: "Links"
                name: "links"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }

          - label: "Colophon (Footer)"
            name: "colophon"
            widget: "object"
            fields:
              - { label: "Byline", name: "byline", widget: "string" }
              - { label: "Quote", name: "quote", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - label: "Links"
                name: "links"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
