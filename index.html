        // GLITCH ANIMATION SYSTEM
        function glitchText(element, targetText, duration = 600) {
            const textSpan = element.querySelector('.text-content') || element;
            if (!textSpan) return;

            let iterations = 0;
            const maxIterations = Math.ceil(duration / 50);

            if (glitchIntervals.has(element)) {
                clearInterval(glitchIntervals.get(element));
            }

            const interval = setInterval(() => {
                textSpan.textContent = targetText
                    .split('')
                    .map((char, index) => {
                        if (char === ' ' || char === '.' || char === ',' || char === '—' || char === '$' ||
                            char === '[' || char === ']' || char === '(' || char === ')') return char;
                        if (iterations > index * (maxIterations / targetText.length)) {
                            return char;
                        }
                        return chars[Math.floor(Math.random() * chars.length)];
                    })
                    .join('');

                iterations++;

                if (iterations >= maxIterations) {
                    clearInterval(interval);
                    textSpan.textContent = targetText;
                    glitchIntervals.delete(element);
                }
            }, 50);

            glitchIntervals.set(element, interval);
        }

        function startPeriodicGlitch(element, targetText) {
            if (periodicTimers.has(element)) return;

            const randomDelay = Math.random() * 10000 + 10000;

            const timer = setInterval(() => {
                glitchText(element, targetText);
            }, randomDelay);

            periodicTimers.set(element, timer);
        }

        function clearAllTimers() {
            glitchIntervals.forEach(id => clearInterval(id));
            glitchIntervals.clear();
            periodicTimers.forEach(id => clearInterval(id));
            periodicTimers.clear();
            if (heroModelCleanup) {
                heroModelCleanup();
                heroModelCleanup = null;
            }
            if (glitchObserver) {
                glitchObserver.disconnect();
                glitchObserver = null;
            }
        }

        function runIntroSequence() {

            Promise.all([

            ]).then(([THREE, gltfModule, dracoModule, asciiModule]) => {
                const { GLTFLoader } = gltfModule;

                const { AsciiEffect } = asciiModule;

                let disposed = false;

                // Intro: 3/4 angle, zoomed in, shifted left-of-centre
                const INTRO_CAM_Z = 5.6;
                const INTRO_CAM_X = 3.0;
                const FINAL_CAM_Z = 6.8;
                const FINAL_CAM_X = 0.0;
                const INTRO_ROT_Y = Math.PI * 0.2;
                const FINAL_ROT_Y = Math.PI * 0.5;
                const TRANSITION_MS = 3000;

                const pointer = { active: false, x: 0, y: 0, targetX: 0, targetY: 0, enabled: false };

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(28, 1, 0.01, 200);
                camera.position.set(INTRO_CAM_X, 0.1, INTRO_CAM_Z);
                camera.lookAt(0, 0.1, 0);

                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setClearColor(0xffffff, 1);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                const effect = new AsciiEffect(renderer, '      .:-=+*#%@GS', {
                    invert: false,
                    resolution: 0.18,
                    overlayProvider: ({ cols, height, rows, width }) => {
                        if (!pointer.enabled || !pointer.active) return null;
                        return { col: (pointer.x / width) * cols, row: (pointer.y / height) * rows, text: 'CLICK' };
                    },

                effect.domElement.style.cssText = 'width:100%;height:100%;color:#f6f1df;background-color:#050505;font-size:4.8px;line-height:4.8px;';
                container.appendChild(effect.domElement);

                scene.add(new THREE.HemisphereLight(0xffffff, 0xffffff, 7.5));
                const kl = new THREE.DirectionalLight(0xffffff, 7.5); kl.position.set(2, 5, 4); scene.add(kl);
                const fl = new THREE.DirectionalLight(0xffffff, 5.5); fl.position.set(-4, 3, 5); scene.add(fl);
                const rl = new THREE.DirectionalLight(0xffffff, 4.5); rl.position.set(-4, 3, -5); scene.add(rl);

                const dracoLoader = new DRACOLoader();
                dracoLoader.setDecoderPath('./vendor/three/examples/jsm/libs/draco/');
                const loader = new GLTFLoader();
                loader.setDRACOLoader(dracoLoader);
                const asciiMaterial = new THREE.MeshStandardMaterial({ color: 0x0d0d0d, metalness: 0, roughness: 0.92 });

                const heroResize = () => {
                    const r = container.getBoundingClientRect();
                    const w = Math.max(1, Math.floor(r.width));
                    const h = Math.max(1, Math.floor(r.height));
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();
                    camera.lookAt(0, 0.1, 0);
                    renderer.setSize(w, h);
                    effect.setSize(w, h);
                };
                window.addEventListener('resize', heroResize);
                // ResizeObserver tracks container size continuously — handles padding animation smoothly
                const resizeObserver = new ResizeObserver(() => heroResize());
                resizeObserver.observe(container);
                heroResize();

                let model = null;
                let phase = 'loading';
                let transitionStart = null;
                let transitionEndTime = null;

                heroModelCleanup = () => {
                    disposed = true;
                    if (frameId) cancelAnimationFrame(frameId);
                    window.removeEventListener('resize', heroResize);
                    resizeObserver.disconnect();
                    renderer.dispose();
                    dracoLoader.dispose();
                    overlay.remove();
                    container.innerHTML = '';
                    if (heroBlockScroll) {
                        window.removeEventListener('wheel', heroBlockScroll);
                        window.removeEventListener('touchmove', heroBlockScroll);
                        heroBlockScroll = null;
                    }
                };

                loader.load(
                    siteData.heroModel,
                    (gltf) => {
                        if (disposed) return;
                        model = gltf.scene;
                        model.traverse(c => {
                            if (c.isMesh) { c.castShadow = false; c.receiveShadow = false; c.material = asciiMaterial; }
                        });
                        const box = new THREE.Box3().setFromObject(model);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        const scale = 5.8 / Math.max(size.x, size.y, size.z);
                        model.scale.setScalar(scale);
                        model.position.set(-center.x * scale, -center.y * scale, -center.z * scale);
                        model.rotation.y = INTRO_ROT_Y;
                        scene.add(model);
                        updateLoadBar(1);
                        const elapsed = performance.now() - loadStartTime;
                        const wait = Math.max(500, MIN_DURATION_MS - elapsed);
                        setTimeout(() => {
                            if (disposed) return;
                            // Step 1 → 2: fade loading bar, then fade overlay to reveal model
                            loadBar.style.opacity = '0';
                            setTimeout(() => {
                                if (disposed) return;
                                overlay.style.transition = 'opacity 1s ease';
                                overlay.style.opacity = '0';
                                overlay.addEventListener('transitionend', () => {
                                    overlay.remove();
                                    // Step 2 → 3: model now visible at 3/4 zoomed — start transition
                                    phase = 'transitioning';
                                    transitionStart = performance.now();
                                }, { once: true });
                            }, 1200); // hold so user sees model at 3/4 before it moves
                        }, wait);
                    },
                    (xhr) => {
                        if (xhr.total > 0) {
                            const elapsed = performance.now() - loadStartTime;
                            updateLoadBar(Math.min(xhr.loaded / xhr.total, elapsed / MIN_DURATION_MS));
                        }
                    },
                    () => { overlay.remove(); if (heroIdentity) heroIdentity.style.opacity = '1'; }
                );

                function easeInOut(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

                function animate() {
                    if (disposed) return;
                    frameId = requestAnimationFrame(animate);

                    if (phase === 'transitioning') {
                        const t = Math.min((performance.now() - transitionStart) / TRANSITION_MS, 1);
                        const e = easeInOut(t);
                        // Zoom out and pan to centre simultaneously
                        camera.position.z = INTRO_CAM_Z + (FINAL_CAM_Z - INTRO_CAM_Z) * e;
                        camera.position.x = INTRO_CAM_X + (FINAL_CAM_X - INTRO_CAM_X) * e;
                        camera.lookAt(0, 0.1, 0);
                        if (model) model.rotation.y = INTRO_ROT_Y + (FINAL_ROT_Y - INTRO_ROT_Y) * e;
                        if (t >= 1) {
                            // Step 3 → 4: transition done — reveal wordmark + nav
                            transitionEndTime = performance.now();
                            phase = 'done';
                            finishSetup();
                        }
                    } else if (phase === 'done' && model) {
                        model.rotation.y = FINAL_ROT_Y + (performance.now() - transitionEndTime) * 0.00028;
                        if (pointer.enabled && pointer.active) {
                            pointer.x += (pointer.targetX - pointer.x) * 0.08;
                            pointer.y += (pointer.targetY - pointer.y) * 0.08;
                        }
                    }

                    effect.render(scene, camera);
                }

                animate();

                function finishSetup() {
                    // rAF loop: animate padding 0→1rem and heroIdentity height 0→auto
                    // heroResize() called every frame so renderer tracks container size smoothly
                    const FRAME_MS = 900;
                    const frameStart = performance.now();
                    const identityFull = 400; // px — well above actual wordmark+nav height to avoid snap
                    function animateFrame() {
                        const t = Math.min((performance.now() - frameStart) / FRAME_MS, 1);
                        const e = easeInOut(t);
                        const pad = (e * 16).toFixed(1) + 'px';
                        if (heroWrapper) { heroWrapper.style.padding = pad; heroWrapper.style.gap = pad; }
                        if (heroIdentity) {
                            heroIdentity.style.maxHeight = (e * identityFull).toFixed(1) + 'px';
                            heroIdentity.style.opacity = String(e);
                        }
                        heroResize();
                        if (t < 1) requestAnimationFrame(animateFrame);
                        else {
                            // Snap to clean final state
                            if (heroWrapper) { heroWrapper.style.padding = ''; heroWrapper.style.gap = ''; }
                            if (heroIdentity) { heroIdentity.style.maxHeight = ''; heroIdentity.style.overflow = ''; heroIdentity.style.opacity = '1'; }
                            heroResize();
                        }
                    }
                    requestAnimationFrame(animateFrame);

                    // Swap scroll block: intro block → hero block (CLICK to scroll)
                    if (heroBlockScroll) {
                        window.removeEventListener('wheel', heroBlockScroll);
                        window.removeEventListener('touchmove', heroBlockScroll);
                        heroBlockScroll = null;
                    }
                    heroBlockScroll = (e) => {
                        const hero = document.getElementById('hero');
                        if (hero && hero.getBoundingClientRect().bottom <= 0) return;
                        e.preventDefault();
                    };
                    window.addEventListener('wheel', heroBlockScroll, { passive: false });
                    window.addEventListener('touchmove', heroBlockScroll, { passive: false });

                    const unblockScroll = () => {
                        if (heroBlockScroll) {
                            window.removeEventListener('wheel', heroBlockScroll);
                            window.removeEventListener('touchmove', heroBlockScroll);
                            heroBlockScroll = null;
                        }
                    };

                    // Enable CLICK cursor
                    pointer.enabled = true;
                    const movePointer = (ev) => {
                        const r = container.getBoundingClientRect();
                        pointer.active = true;
                        pointer.targetX = ev.clientX - r.left;
                        pointer.targetY = ev.clientY - r.top;
                        if (pointer.x === 0 && pointer.y === 0) { pointer.x = pointer.targetX; pointer.y = pointer.targetY; }
                    };
                    container.addEventListener('pointerenter', () => { pointer.active = true; });
                    container.addEventListener('pointermove', movePointer);
                    container.addEventListener('pointerleave', () => { pointer.active = false; });

                    const clickOverlay = document.createElement('div');
                    clickOverlay.style.cssText = 'position:absolute;inset:0;z-index:10;cursor:none;';
                    container.appendChild(clickOverlay);
                    clickOverlay.addEventListener('click', () => {
                        unblockScroll();

                        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });

                    heroModelCleanup = () => {
                        disposed = true;
                        unblockScroll();
                        if (frameId) cancelAnimationFrame(frameId);
                        window.removeEventListener('resize', heroResize);
                        resizeObserver.disconnect();
                        container.innerHTML = '';
                        renderer.dispose();
                        dracoLoader.dispose();
                        if (heroIdentity) { heroIdentity.style.maxHeight = ''; heroIdentity.style.overflow = ''; heroIdentity.style.opacity = ''; }
                        if (heroWrapper) { heroWrapper.style.padding = ''; heroWrapper.style.gap = ''; }
                    };
                }

            }).catch(() => {

                if (heroIdentity) { heroIdentity.style.maxHeight = ''; heroIdentity.style.overflow = ''; heroIdentity.style.opacity = '1'; }
                if (heroWrapper) { heroWrapper.style.padding = ''; heroWrapper.style.gap = ''; }

                    window.removeEventListener('touchmove', heroBlockScroll);

                }

                setupHeroModel();

        function setupHeroModel() {

                import('./vendor/three/examples/jsm/loaders/GLTFLoader.js'),
                import('./vendor/three/examples/jsm/loaders/DRACOLoader.js'),
                import('./vendor/three/examples/jsm/effects/AsciiEffect.js'),
            ]).then(([THREE, gltfModule, dracoModule, asciiModule]) => {
                if (disposed) return;

                const { GLTFLoader } = gltfModule;
                const { DRACOLoader } = dracoModule;
                const { AsciiEffect } = asciiModule;
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0xffffff);

                const camera = new THREE.PerspectiveCamera(28, 1, 0.01, 200);
                camera.position.set(0, 0.1, 6.8);
                camera.lookAt(0, 0.1, 0);

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
                renderer.setClearColor(0xffffff, 1);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                const effect = new AsciiEffect(renderer, '      .:-=+*#%@GS', {
                    invert: false,
                    resolution: 0.18,
                    overlayProvider: ({ cols, height, rows, width }) => {
                        if (!pointer.active) return null;
                        return {
                            col: (pointer.x / width) * cols,
                            row: (pointer.y / height) * rows,
                            text: 'CLICK',
                        };
                    },
                });

                effect.domElement.style.width = '100%';
                effect.domElement.style.height = '100%';
                effect.domElement.style.color = '#f6f1df';
                effect.domElement.style.backgroundColor = '#050505';
                effect.domElement.style.fontSize = '4.8px';
                effect.domElement.style.lineHeight = '4.8px';
                container.appendChild(effect.domElement);

                scene.add(new THREE.HemisphereLight(0xffffff, 0xffffff, 7.5));

                const keyLight = new THREE.DirectionalLight(0xffffff, 7.5);
                keyLight.position.set(2, 5, 4);
                scene.add(keyLight);

                const fillLight = new THREE.DirectionalLight(0xffffff, 5.5);
                fillLight.position.set(-4, 3, 5);
                scene.add(fillLight);

                const rimLight = new THREE.DirectionalLight(0xffffff, 4.5);
                rimLight.position.set(-4, 3, -5);
                scene.add(rimLight);

                const dracoLoader = new DRACOLoader();
                dracoLoader.setDecoderPath('./vendor/three/examples/jsm/libs/draco/');

                const loader = new GLTFLoader();
                loader.setDRACOLoader(dracoLoader);

                const asciiMaterial = new THREE.MeshStandardMaterial({
                    color: 0x0d0d0d,
                    metalness: 0,
                    roughness: 0.92,
                });

                let model = null;
                let baseRotationY = 0;

                const resize = () => {
                    const rect = container.getBoundingClientRect();
                    const width = Math.max(1, Math.floor(rect.width));
                    const height = Math.max(1, Math.floor(rect.height));
                    camera.aspect = width / height;
                    camera.updateProjectionMatrix();
                    camera.lookAt(0, 0.1, 0);
                    renderer.setSize(width, height);
                    effect.setSize(width, height);
                };

                resizeHandler = resize;
                window.addEventListener('resize', resize);
                resize();

                loader.load(
                    siteData.heroModel,
                    (gltf) => {
                        if (disposed) return;
                        model = gltf.scene;
                        model.traverse((child) => {
                            if (child.isMesh) {
                                child.castShadow = false;
                                child.receiveShadow = false;
                                child.material = asciiMaterial;
                            }
                        });

                        const box = new THREE.Box3().setFromObject(model);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        const maxAxis = Math.max(size.x, size.y, size.z);
                        const scale = 5.8 / maxAxis;

                        model.scale.setScalar(scale);
                        model.position.set(-center.x * scale, -center.y * scale, -center.z * scale);
                        baseRotationY = Math.PI * 0.5;
                        model.rotation.y = baseRotationY;
                        scene.add(model);
                    },
                    undefined,
                    () => {
                        container.textContent = 'Could not load model.';
                    },
                );

                const animate = () => {
                    if (disposed) return;
                    frameId = requestAnimationFrame(animate);
                    if (pointer.active) {
                        pointer.x += (pointer.targetX - pointer.x) * 0.08;
                        pointer.y += (pointer.targetY - pointer.y) * 0.08;
                    }
                    if (model) {
                        model.rotation.y = baseRotationY + performance.now() * 0.00028;
                    }
                    effect.render(scene, camera);
                };

                animate();

                heroModelCleanup = () => {
                    disposed = true;
                    unblockScroll();
                    if (frameId) cancelAnimationFrame(frameId);
                    if (resizeHandler) window.removeEventListener('resize', resizeHandler);
                    container.innerHTML = '';
                    renderer.dispose();
                    dracoLoader.dispose();
                };
            }).catch(() => {
                if (!disposed) {
                    container.style.color = '#f6f1df';
                    container.style.fontSize = '11px';
                    container.textContent = '[ model unavailable ]';
                }
            });

        }

        function setupGlitchEffects() {
            glitchObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const targetText = entry.target.dataset.text;
                        if (targetText) {
                            setTimeout(() => {
                                glitchText(entry.target, targetText);
                                startPeriodicGlitch(entry.target, targetText);
                            }, 100);
                            glitchObserver.unobserve(entry.target);
                        }
                    }
                });
            }, { threshold: 0.3 });

            document.querySelectorAll('.glitch-text').forEach(element => {
                if (element.dataset.text) {
                    glitchObserver.observe(element);
                }
            });

            setTimeout(() => {
                document.querySelectorAll('.glitch-text').forEach((element, index) => {
                    const targetText = element.dataset.text;
                    if (targetText && element.getBoundingClientRect().top < window.innerHeight) {
                        setTimeout(() => {
                            glitchText(element, targetText);
                            startPeriodicGlitch(element, targetText);
                        }, index * 100);
                    }
                });
            }, 500);
        }


        // VIEW FUNCTIONS
        function viewWorkItem(id) {
            const item = siteData.workPreviews.find(w => w.id === id);
            if (!item) return;

            clearAllTimers();
            const pageContent = document.getElementById('pageContent');
            pageContent.innerHTML = `
                <div class="content-page">
                    <button onclick="loadPage('work')" style="background:none;border:none;font-family:'IBM Plex Mono',monospace;font-size:11px;font-style:italic;color:var(--text-tertiary);cursor:pointer;padding:0;margin-bottom:2rem;display:block;">← back</button>
                    <h1 class="glitch-text" data-text="${item.title}">
                        <span class="text-content">${item.title}</span>
                    </h1>
                    <div class="content">
                        <p class="glitch-text" data-text="${item.fullContent}">
                            <span class="text-content">${item.fullContent}</span>
                        </p>
                    </div>
                </div>
                ${renderFooter([['Home','home'],['Work','work'],['About','about']])}
            `;
            setupGlitchEffects();
            window.scrollTo(0, 0);
        }

        function viewBlogPost(id) {
            const post = siteData.blogPosts.find(p => p.id === id);
            if (!post) return;

            clearAllTimers();
            const pageContent = document.getElementById('pageContent');
            const paragraphs = post.fullContent.split('\n\n')
                .map(p => `<p>${p}</p>`).join('');
            pageContent.innerHTML = `
                <div class="content-page">
                    <button onclick="loadPage('blog')" style="background:none;border:none;font-family:'IBM Plex Mono',monospace;font-size:11px;font-style:italic;color:var(--text-tertiary);cursor:pointer;padding:0;margin-bottom:2rem;display:block;">← back</button>
                    <h1 class="glitch-text" data-text="${post.title}">
                        <span class="text-content">${post.title}</span>
                    </h1>
                    <div class="post-date glitch-text" data-text="${post.date}">
                        <span class="text-content">${post.date}</span>
                    </div>
                    <div class="post-body">${paragraphs}</div>
                </div>
                ${renderFooter([['Home','home'],['Work','work'],['About','about']])}
            `;
            setupGlitchEffects();
            window.scrollTo(0, 0);
        }

        // CUSTOM CURSOR
        document.addEventListener('mousemove', (e) => {
            const cursor = document.getElementById('customCursor');
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';

            const hoveredElement = document.elementFromPoint(e.clientX, e.clientY);
            let cursorText = '';
            let shouldShow = false;

            if (hoveredElement) {
                if (hoveredElement.closest('.hero-nav-link, .nav-link, .header-left, .header-right')) {
                    cursorText = 'navigate →';
                    shouldShow = true;
                } else if (hoveredElement.closest('.preview-item')) {
                    const previewItem = hoveredElement.closest('.preview-item');
                    const section = previewItem.closest('.preview-section');
                    if (section) {
                        const header = section.querySelector('.section-header');
                        if (header && header.textContent.includes('WORK')) {
                            cursorText = 'view case →';
                        } else if (header && header.textContent.includes('INSIGHT')) {
                            cursorText = 'read article →';
                        } else if (header && header.textContent.includes('GARAGE')) {
                            cursorText = 'view listing →';
                        } else {
                            cursorText = 'learn more →';
                        }
                    }
                    shouldShow = true;
                } else if (hoveredElement.closest('.footer-column a')) {
                    cursorText = 'open link →';
                    shouldShow = true;
                } else if (hoveredElement.closest('.hero-artwork')) {
                    cursorText = 'scroll down →';
                    shouldShow = true;
                }
            }

            cursor.textContent = cursorText;
            if (shouldShow) {
                cursor.classList.add('visible');
            } else {
                cursor.classList.remove('visible');
            }
        });

        // FLOATING BUTTONS + MENU
        window.addEventListener('scroll', () => {
            const floatingButtons = document.getElementById('floatingButtons');
            const floatingMenu = document.getElementById('floatingMenu');
            floatingButtons.classList.toggle('visible', window.scrollY > 400);
            if (currentPage === 'home') {
                const heroNavRow = document.getElementById('heroNavRow');
                const past = heroNavRow ? heroNavRow.getBoundingClientRect().bottom < 0 : window.scrollY > 400;
                floatingMenu.classList.toggle('visible', past);
            } else {
                floatingMenu.classList.remove('visible');
            }
        });

        document.getElementById('floatingMenu').addEventListener('click', (e) => {
            const item = e.target.closest('[data-nav]');
            if (item) loadPage(item.dataset.nav);
        });

        document.getElementById('scrollTopBtn').addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.getElementById('darkModeBtn').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('darkModeBtn').textContent = isDark ? '[ ☀ ]' : '[ ◐ ]';
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
        });

        if (localStorage.getItem('darkMode') === 'enabled') {
            document.body.classList.add('dark-mode');
            document.getElementById('darkModeBtn').textContent = '[ ☀ ]';
        }


        // NAVIGATION — set up once, delegates to dynamically rendered content
        // Prevent browser from restoring scroll position on refresh — always start at top
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

        document.addEventListener('DOMContentLoaded', () => {
            window.scrollTo(0, 0);
            document.getElementById('logoLink').addEventListener('click', () => loadPage('home'));

            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    loadPage(link.dataset.page);
                });
            });

            document.getElementById('contactLink').addEventListener('click', () => loadPage('contact'));

            loadPage('home');
        });
    </script>
</body>
</html>
